// Browser cleanup: restore com_fixedTic 0, g_stopTime 0, in_nograb 0,
// developer 0, s_noSound 0 and user display settings before loading the save.
// Disposable licensed-data replay: reload the user save afterward.
// Covers charged BFG direct/splash damage and blocked-target preservation.
// notarget isolates damage; pursuit and long-flight beam damage are not covered.
set r_fullscreen 0
set r_mode 3
set s_noSound 1
set in_nograb 1
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set developer 1
set g_stopTime 0
set g_debugRandomSeed 0
set ui_showGun 1
set g_showHud 1
devmap game/mars_city2
notarget
give weapons
give ammo
echo PARITY_PHASE bfg_selected
testUsercmd 100 0 0 0 0 8
setviewpos -226 -2254 84 90
spawn monster_zombie_maint name codex_bfg_a origin "-226 -2200 16" angle 270 ambush 1
spawn monster_zombie_maint name codex_bfg_b origin "-190 -2210 16" angle 270 ambush 1
spawn monster_zombie_maint name codex_bfg_blocked origin "-226 -2000 16" angle 270 ambush 1
echo PARITY_PHASE bfg_targets
testUsercmd 1 0 0 0 0
testEntityState codex_bfg_a
testEntityState codex_bfg_b
testEntityState codex_bfg_blocked
getviewpos state
echo PARITY_PHASE bfg_charge
testUsercmd 50 0 0 0 1
testEntityState codex_bfg_a
testEntityState codex_bfg_b
testEntityState codex_bfg_blocked
getviewpos state
echo PARITY_PHASE bfg_release
testUsercmd 1 0 0 0 0
testEntityState codex_bfg_a
testEntityState codex_bfg_b
testEntityState codex_bfg_blocked
getviewpos state
echo PARITY_PHASE bfg_earlyimpact
testUsercmd 22 0 0 0 0
testEntityState codex_bfg_a
testEntityState codex_bfg_b
testEntityState codex_bfg_blocked
getviewpos state
echo PARITY_PHASE bfg_impact
testUsercmd 50 0 0 0 0
testEntityState codex_bfg_a
testEntityState codex_bfg_b
testEntityState codex_bfg_blocked
getviewpos state
echo PARITY_PHASE bfg_settled
testUsercmd 300 0 0 0 0
testEntityState codex_bfg_a
testEntityState codex_bfg_b
testEntityState codex_bfg_blocked
getviewpos state
set g_stopTime 1
condump "bfg-target-console.txt"
quit


