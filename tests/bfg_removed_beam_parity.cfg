// Browser cleanup: restore com_fixedTic 0, g_stopTime 0, in_nograb 0,
// developer 0, s_noSound 0 and user display settings before loading the save.
// Disposable licensed-data replay: reload the user save afterward.
// Exercises removal of the first acquired BFG target between periodic pulses.
// notarget isolates weapon damage from pursuit; stock map/door timing remains.
set r_fullscreen 0
set r_mode 3
set s_noSound 1
set in_nograb 1
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set developer 1
set g_stopTime 0
set g_debugRandomSeed 0
set ui_showGun 1
set g_showHud 1
devmap game/mars_city2
notarget
give weapons
give ammo
echo PARITY_PHASE beam_selected
testUsercmd 100 0 0 0 0 8
setviewpos -226 -2254 84 90
echo PARITY_PHASE beam_settle
testUsercmd 100 0 0 0 0
spawn monster_zombie_maint name codex_beam_a origin "-190 -2210 16" angle 180 neverDormant 1
spawn monster_zombie_maint name codex_beam_b origin "-190 -2250 16" angle 180 neverDormant 1
echo PARITY_PHASE beam_target
testUsercmd 1 0 0 0 0
testEntityState codex_beam_a
testEntityState codex_beam_b
getviewpos state
echo PARITY_PHASE beam_charge
testUsercmd 50 0 0 0 1
testEntityState codex_beam_a
testEntityState codex_beam_b
getviewpos state
echo PARITY_PHASE beam_release
testUsercmd 1 0 0 0 0
testEntityState codex_beam_a
testEntityState codex_beam_b
getviewpos state
echo PARITY_PHASE beam_before_damage
testUsercmd 20 0 0 0 0
testEntityState codex_beam_a
testEntityState codex_beam_b
getviewpos state
echo PARITY_PHASE beam_damage1
testUsercmd 2 0 0 0 0
testEntityState codex_beam_a
testEntityState codex_beam_b
getviewpos state
remove codex_beam_b
echo PARITY_PHASE beam_damage2
testUsercmd 20 0 0 0 0
testEntityState codex_beam_a
testEntityState codex_beam_b
getviewpos state
echo PARITY_PHASE beam_impact
testUsercmd 2 0 0 0 0
testEntityState codex_beam_a
testEntityState codex_beam_b
getviewpos state
echo PARITY_PHASE beam_ragdoll
testUsercmd 22 0 0 0 0
testEntityState codex_beam_a
testEntityState codex_beam_b
getviewpos state
echo PARITY_PHASE beam_recovery
testUsercmd 200 0 0 0 0
testEntityState codex_beam_a
testEntityState codex_beam_b
getviewpos state
echo PARITY_PHASE beam_removed
testUsercmd 300 0 0 0 0
testEntityState codex_beam_a
testEntityState codex_beam_b
getviewpos state
set g_stopTime 1
condump "bfg-removed-beam-console.txt"
quit
