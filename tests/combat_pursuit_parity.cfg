// Disposable stock-zombie pursuit and melee replay; never overwrite the user's save.
// Keep stock AI scripts, navigation and damage. No notarget, forced enemy or damage commands.
// Ends after player ragdoll settling, before the later game-over session transition.
// Restore in_nograb 0, com_fixedTic 0, g_stopTime 0, developer 0, s_noSound 0
// and user display settings before reloading the user's game.
set r_fullscreen 0
set r_mode 3
set s_noSound 1
set in_nograb 1
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set developer 1
set g_stopTime 0
set g_debugRandomSeed 0
set ui_showGun 1
set g_showHud 1
set g_skill 1
set g_damageScale 1
set g_useDynamicProtection 1
set g_testDeath 0
devmap game/mars_city2
setviewpos -226 -2254 84 90
echo PARITY_PHASE combat_settle
testUsercmd 200 0 0 0 0
listMonsters
getviewpos state
spawn monster_zombie_maint name codex_combat_zombie origin "-190 -2190 16" angle 270 neverDormant 1
echo PARITY_PHASE combat_0
testUsercmd 1 0 0 0 0
testEntityState codex_combat_zombie
listMonsters
getviewpos state
echo PARITY_PHASE combat_1
testUsercmd 60 0 0 0 0
testEntityState codex_combat_zombie
listMonsters
getviewpos state
echo PARITY_PHASE combat_2
testUsercmd 100 0 0 0 0
testEntityState codex_combat_zombie
listMonsters
getviewpos state
echo PARITY_PHASE combat_3
testUsercmd 200 0 0 0 0
testEntityState codex_combat_zombie
listMonsters
getviewpos state
echo PARITY_PHASE combat_4
testUsercmd 300 0 0 0 0
testEntityState codex_combat_zombie
listMonsters
getviewpos state
echo PARITY_PHASE combat_5
testUsercmd 300 0 0 0 0
testEntityState codex_combat_zombie
listMonsters
getviewpos state
set g_stopTime 1
condump "combat-pursuit-console.txt"
quit
