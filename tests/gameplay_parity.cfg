// Run only in an isolated native save/config directory. This advances a fresh
// Mars City map using fixed usercmds; it is not a campaign playthrough.
set r_fullscreen 0
set r_mode 3
set s_noSound 1
set in_nograb 1
set com_allowConsole 1
set com_asyncInput 0
set com_fixedTic 1
set developer 1
devmap game/mars_city2
wait 5
testUsercmd 0 0 0 0 0
testUsercmd 301 0 0 0 0
testUsercmd 1 128 0 0 0
testUsercmd 1 0 0 0 0 62
testUsercmd 0 0 0 0 0
testUsercmd 30 127 0 0 0
testUsercmd 30 0 127 0 0
testUsercmd 1 0 0 127 0
testUsercmd 10 0 0 0 0
testUsercmd 50 0 0 0 0
testUsercmd 20 0 0 -127 0
testUsercmd 20 0 0 0 0
give weapons
give ammo
testUsercmd 80 0 0 0 0 1
testUsercmd 0 0 0 0 0
testUsercmd 60 0 0 0 1
testUsercmd 1 0 0 0 0
testUsercmd 60 0 0 0 1
testUsercmd 30 0 0 0 0
testUsercmd 180 0 0 0 0 13
testUsercmd 0 0 0 0 0
condump "parity-console.txt"
quit
