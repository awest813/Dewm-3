// Browser cleanup: restore com_fixedTic 0, g_stopTime 0, in_nograb 0,
// developer 0, s_noSound 0 and user display settings before loading the save.
// Disposable licensed-data replay: reload the user save afterward.
// notarget isolates weapon damage; enemy pursuit/attacks are not covered.
set r_fullscreen 0
set r_mode 3
set s_noSound 1
set in_nograb 1
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set developer 1
set g_stopTime 0
set g_debugRandomSeed 0
// View-model smoke uses the game random stream; keep display settings equal.
set ui_showGun 1
set g_showHud 1
devmap game/mars_city2
notarget
give weapons
give ammo
echo PARITY_PHASE chainsaw_selected
testUsercmd 100 0 0 0 0 10
setviewpos -226 -2254 84 90
spawn monster_zombie_maint name codex_melee_target origin "-226 -2200 16" angle 270 ambush 1
echo PARITY_PHASE target_spawned
testUsercmd 1 0 0 0 0
testEntityState codex_melee_target
getviewpos state
echo PARITY_PHASE chainsaw_first_hit
testUsercmd 10 0 0 0 1
testEntityState codex_melee_target
getviewpos state
echo PARITY_PHASE chainsaw_followup
testUsercmd 20 0 0 0 1
testEntityState codex_melee_target
getviewpos state
echo PARITY_PHASE chainsaw_kill
testUsercmd 100 0 0 0 1
testEntityState codex_melee_target
getviewpos state
echo PARITY_PHASE chainsaw_recovery
testUsercmd 100 0 0 0 0
testEntityState codex_melee_target
getviewpos state
set g_stopTime 1
condump "melee-hit-console.txt"
quit
