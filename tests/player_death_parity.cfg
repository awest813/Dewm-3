// Disposable stock-weapon splash replay; never overwrite the user's save.
// Restore in_nograb 0, com_fixedTic 0, g_stopTime 0, developer 0, s_noSound 0
// and user display settings before reloading the user's game.
set r_fullscreen 0
set r_mode 3
set s_noSound 1
set in_nograb 1
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set developer 1
set g_stopTime 0
set g_debugRandomSeed 0
set ui_showGun 1
set g_showHud 1
set g_skill 1
set g_damageScale 1
set g_useDynamicProtection 1
set g_testDeath 0
devmap game/mars_city2
give weapons
give ammo
setviewpos -224 -2236 83.75 0
echo PARITY_PHASE death_selected
testUsercmd 100 0 0 0 0 7
getviewpos state
echo PARITY_PHASE death_shot1
testUsercmd 1 0 0 0 1
getviewpos state
echo PARITY_PHASE death_impact1
testUsercmd 120 0 0 0 0
getviewpos state
setviewpos -224 -2236 83.75 0
echo PARITY_PHASE death_shot2
testUsercmd 1 0 0 0 1
getviewpos state
echo PARITY_PHASE death_impact2
testUsercmd 120 0 0 0 0
getviewpos state
setviewpos -224 -2236 83.75 0
echo PARITY_PHASE death_shot3
testUsercmd 1 0 0 0 1
getviewpos state
echo PARITY_PHASE death_impact3
testUsercmd 30 0 0 0 0
getviewpos state
echo PARITY_PHASE death_fall
testUsercmd 90 0 0 0 0
getviewpos state
echo PARITY_PHASE death_settled
testUsercmd 300 0 0 0 0
getviewpos state
set g_stopTime 1
quit
