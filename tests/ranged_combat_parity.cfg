// Stock imp ranged combat and shotgun retaliation; use an isolated disposable map.
// No notarget, forced enemy, health override or direct damage commands.
// Restore normal timing, input, audio and display settings, then reload the user save.
set r_fullscreen 0
set r_mode 3
set s_noSound 1
set in_nograb 1
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set developer 1
set g_stopTime 0
set g_debugRandomSeed 0
set ui_showGun 1
set g_showHud 1
set g_skill 1
set g_damageScale 1
set g_useDynamicProtection 1
set g_testDeath 0
devmap game/mars_city2
setviewpos -226 -2254 84 90
echo PARITY_PHASE ranged_settle
testUsercmd 200 0 0 0 0
getviewpos state
spawn monster_demon_imp name codex_ranged_imp origin "-226 -2030 16" angle 270 neverDormant 1
echo PARITY_PHASE ranged_acquire
testUsercmd 1 0 0 0 0
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_awaken
testUsercmd 100 0 0 0 0
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_pursuit
testUsercmd 100 0 0 0 0
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_retaliate
testUsercmd 5 0 0 0 1
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_prepare
testUsercmd 75 0 0 0 1
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_flight
testUsercmd 5 0 0 0 1
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_approach
testUsercmd 5 0 0 0 1
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_impact
testUsercmd 5 0 0 0 1
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_release
// Final held-trigger interval; the next testUsercmd releases attack.
testUsercmd 25 0 0 0 1
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_hit_again
testUsercmd 60 0 0 0 0
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_recover
testUsercmd 40 0 0 0 0
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_exchange
testUsercmd 300 0 0 0 0
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_kill
testUsercmd 60 0 0 0 1
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_cleanup
testUsercmd 300 0 0 0 0
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
echo PARITY_PHASE ranged_removed
testUsercmd 300 0 0 0 0
testEntityState codex_ranged_imp
testOwnedProjectiles codex_ranged_imp
listMonsters
getviewpos state
set g_stopTime 1
condump ranged-combat-console.txt
quit
