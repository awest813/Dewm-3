// Player view effects, HUD and gamma (native and web). Views: hud, tunnel,
// berserk (CropRenderSize + CaptureRenderToImage + overlay), damage (blood
// blob, double vision, view kick, low-health tunnel), fade, gamma.
// Native: tests/web_bench/native_capture.py --fixture effects.
set r_fullscreen 0
set r_mode 3
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set com_showFPS 0
set developer 1
set s_noSound 1
set in_nograb 1
set g_stopTime 0
set g_showHud 1
set ui_showGun 1
set g_testPostProcess ""
set g_skipViewEffects 0
set r_gammaInShader 1
set r_gamma 1
set r_brightness 1
set r_useSoftParticles 1
set r_shadows 1
set r_showShadows 0
set r_useCarmacksReverse 1
set r_useStencilOpSeparate 1
set r_useExternalShadows 1
set r_useShadowVertexProgram 1
set r_shadowPolygonOffset -1
set r_shadowPolygonFactor 0
set r_skipBump 0
set r_skipSpecular 0
set r_skipAmbient 0
set r_skipInteractions 0
set r_skipNewAmbient 0
set r_skipFogLights 0
set com_machineSpec 3
execMachineSpec nores
set image_anisotropy 8
set r_screenshotFormat 2
set s_constantAmplitude 0.5
devmap game/alphalabs1
noclip
setviewpos -668 800 164.25 270
testUsercmd 60 0 0 0 0
set g_stopTime 1
echo EFFECT_VIEW hud
getviewpos state
screenshot 640 480
set g_testHealthVision 25
echo EFFECT_VIEW tunnel
screenshot 640 480
set g_testHealthVision 0
set g_stopTime 0
give berserk
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo EFFECT_VIEW berserk
getviewpos state
screenshot 640 480
set g_stopTime 0
devmap game/alphalabs1
noclip
setviewpos -668 800 164.25 270
testUsercmd 60 0 0 0 0
testDamage damage_generic
testUsercmd 3 0 0 0 0
set g_stopTime 1
echo EFFECT_VIEW damage
getviewpos state
screenshot 640 480
set r_gamma 1.3
set r_brightness 1.5
echo EFFECT_VIEW gamma
screenshot 640 480
set r_gamma 1
set r_brightness 1
set g_stopTime 0
quit
