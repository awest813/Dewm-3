// Licensed-data hangar captures in an isolated native save/config directory.
// Browser: omit screenshot/quit, use Screenshot at each frozen checkpoint.
// Restore normal input, timing, HUD, weapon, audio and quality settings afterward.
// Exclude the opening player-view fade; this fixture audits world materials.
set r_fullscreen 0
set r_mode 3
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set com_showFPS 0
set developer 1
set s_noSound 1
set in_nograb 1
set g_stopTime 0
set g_showHud 0
set ui_showGun 0
set g_testPostProcess ""
set g_skipViewEffects 1
set r_gammaInShader 1
set r_gamma 1
set r_brightness 1
set r_useSoftParticles 1
set r_shadows 1
set r_showShadows 0
set r_useCarmacksReverse 1
set r_useStencilOpSeparate 1
set r_useExternalShadows 1
set r_useShadowVertexProgram 1
set r_shadowPolygonOffset -1
set r_shadowPolygonFactor 0
set r_skipBump 0
set r_skipSpecular 0
set r_skipAmbient 0
set r_skipInteractions 0
set r_skipNewAmbient 0
set r_skipFogLights 0
set com_machineSpec 3
execMachineSpec nores
set image_anisotropy 8
devmap game/mars_city1
noclip
setviewpos 1279.37 -1739.38 68.25 300
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo HANGAR_VIEW rails
getviewpos state
set r_screenshotFormat 2
screenshot 640 480
set g_stopTime 0
setviewpos 1267 -1550 68.25 180
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo HANGAR_VIEW stairs
getviewpos state
screenshot 640 480
set g_stopTime 0
setviewpos 1263.77 -1501 68.25 180
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo HANGAR_VIEW saved_rail
getviewpos state
screenshot 640 480
quit
