// Uses licensed Steam data locally; contains no game assets.
// Native: isolated fs_savepath/fs_configpath/fs_devpath; mode 3, fullscreen 0.
// Browser: screenshot -> webscreenshot; omit condump/quit; download each PNG.
// Submit map load, teleport, bounded replay and freeze as one browser command.
// glass2 on func_static_53006 exercises plain heatHaze in a real 3D view.
// breakyglass3 on func_fracture_2 exercises the vertex-masked variant.
// vp1 on func_static_53020 exercises mask-only heat haze.
set com_allowConsole 1
// Exclude the wall-clock loading-screen wipe from these material captures.
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set com_showFPS 0
set developer 1
set g_stopTime 0
set g_showHud 0
set ui_showGun 0
set g_testPostProcess ""
set r_gammaInShader 1
set r_gamma 1
set r_brightness 1
set r_useSoftParticles 1
set r_shadows 1
set r_skipBump 0
set r_skipSpecular 0
set r_skipAmbient 0
set r_skipInteractions 0
set r_skipNewAmbient 0
set com_machineSpec 3
execMachineSpec nores
set image_anisotropy 8
devmap game/mars_city2
noclip
setviewpos -3200 -2884 269 0
// Advance the real simulation so the cached render view reflects the teleport.
// Waiting on the command buffer alone does not update that view reliably.
testUsercmd 1 0 0 0 0
set g_stopTime 1
getviewpos state
set r_screenshotFormat 2
screenshot 640 480
set r_skipNewAmbient 1
screenshot 640 480
set r_skipNewAmbient 0
set g_stopTime 0
setviewpos -1908 -304 274 0
testUsercmd 1 0 0 0 0
set g_stopTime 1
getviewpos state
screenshot 640 480
set r_skipNewAmbient 1
screenshot 640 480
set r_skipNewAmbient 0
set g_stopTime 0
setviewpos -1724 -2341 247 0
testUsercmd 1 0 0 0 0
set g_stopTime 1
getviewpos state
screenshot 640 480
set r_skipNewAmbient 1
screenshot 640 480
set r_skipNewAmbient 0
// Background controls for the mask-only view. Keep its heat stage disabled.
set r_skipNewAmbient 1
set r_shadows 0
screenshot 640 480
set r_shadows 1
set r_skipFogLights 1
screenshot 640 480
set r_skipFogLights 0
set r_skipAmbient 1
screenshot 640 480
set r_skipAmbient 0
set r_useSoftParticles 0
screenshot 640 480
set r_useSoftParticles 1
set r_skipNewAmbient 0
condump "render-heat-console.txt"
quit
