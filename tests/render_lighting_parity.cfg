// Native: isolated fs_savepath/fs_configpath/fs_devpath; r_mode 3, fullscreen 0.
// Browser: screenshot -> webscreenshot; omit condump/quit; download each PNG.
// Seven frozen captures: normal, no bump, no specular, neither, no ambient,
// no interactions, normal at 8x anisotropy. First six use 1x filtering.
// Browser: load/map/replay/freeze in ONE command to avoid idle world ticks.
// Animation outside the measured region is not a parity oracle.
set com_allowConsole 1
set com_asyncInput 0
set com_fixedTic 1
set com_showFPS 0
set developer 1
set g_stopTime 0
set g_showHud 0
set g_testPostProcess ""
set r_gammaInShader 1
set r_gamma 1
set r_brightness 1
set r_useSoftParticles 1
set r_shadows 1
set r_skipBump 0
set r_skipSpecular 0
set r_skipAmbient 0
set r_skipInteractions 0
set r_skipNewAmbient 0
set com_machineSpec 3
execMachineSpec nores
set image_anisotropy 1
devmap game/mars_city2
give weapons
give ammo
testUsercmd 80 0 0 0 0 1
setviewpos -224 -2236 100 145
testUsercmd 20 0 0 0 0
set g_stopTime 1
getviewpos
set r_screenshotFormat 2
screenshot 640 480
set r_skipBump 1
screenshot 640 480
set r_skipBump 0
set r_skipSpecular 1
screenshot 640 480
set r_skipBump 1
screenshot 640 480
set r_skipBump 0
set r_skipSpecular 0
set r_skipAmbient 1
screenshot 640 480
set r_skipAmbient 0
set r_skipInteractions 1
screenshot 640 480
set r_skipInteractions 0
set image_anisotropy 8
screenshot 640 480
condump "render-lighting-console.txt"
quit
