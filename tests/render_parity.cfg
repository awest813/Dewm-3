// Licensed-data scene capture. Use an isolated native save/config directory.
// Browser: submit through Engine command, replacing screenshot with
// webscreenshot and omit condump/quit. Download each PNG before the next one.
// The refrigerator view exercises stock masked reflection glass, not heat haze.
// Browser: send the unfreeze/teleport separately from freeze/capture so a
// rendered game frame updates the cached camera; wait counts command passes.
set com_allowConsole 1
set com_asyncInput 0
set com_fixedTic 1
set com_showFPS 0
set developer 1
set g_stopTime 0
set g_testPostProcess ""
set r_gammaInShader 1
set r_gamma 1
set r_brightness 1
set r_useSoftParticles 1
set r_shadows 1
set r_skipBump 0
set r_skipSpecular 0
set com_machineSpec 3
execMachineSpec nores
devmap game/mars_city2
wait 5
give weapons
give ammo
testUsercmd 80 0 0 0 0 1
setviewpos -224 -2236 100 145
testUsercmd 20 0 0 0 0
echo RENDER_PARITY_STATE
testUsercmd 0 0 0 0 0
set g_stopTime 1
set r_screenshotFormat 2
screenshot 640 480
set g_showHud 0
set g_stopTime 0
noclip
setviewpos -2370 -2800 280 90
wait 5
set g_stopTime 1
getviewpos
screenshot 640 480
set r_skipNewAmbient 1
screenshot 640 480
set r_skipNewAmbient 0
condump "render-parity-console.txt"
quit
