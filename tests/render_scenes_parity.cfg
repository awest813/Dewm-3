// Licensed-data campaign render views (native and web) beyond the hangar.
// Native: tests/web_bench/native_capture.py (or dhewm3 +set fs_savepath <dir>
// +set fs_configpath <dir> +exec this file).
// Web: tests/web_bench/prepare.py derives the browser form (no window/quit).
// Each view places the camera, advances fixed ticks (60 after a map load, 1
// between views on one map, 320 for the imp encounter), freezes game time,
// prints RENDER_STATE and captures 640x480.
// Compare web captures only with a 640x480 drawing buffer (the projection
// follows the window aspect).
set r_fullscreen 0
set r_mode 3
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set com_showFPS 0
set developer 1
set s_noSound 1
set in_nograb 1
set g_stopTime 0
set g_showHud 0
set ui_showGun 0
set g_testPostProcess ""
set g_skipViewEffects 1
set r_gammaInShader 1
set r_gamma 1
set r_brightness 1
set r_useSoftParticles 1
set r_shadows 1
set r_showShadows 0
set r_useCarmacksReverse 1
set r_useStencilOpSeparate 1
set r_useExternalShadows 1
set r_useShadowVertexProgram 1
set r_shadowPolygonOffset -1
set r_shadowPolygonFactor 0
set r_skipBump 0
set r_skipSpecular 0
set r_skipAmbient 0
set r_skipInteractions 0
set r_skipNewAmbient 0
set r_skipFogLights 0
set com_machineSpec 3
execMachineSpec nores
set image_anisotropy 8
set r_screenshotFormat 2
// Sound-driven lights follow the wall-clock sound timeline; pin them.
set s_constantAmplitude 0.5
devmap game/mc_underground
noclip
setviewpos 3848 -1216 300.25 0
testUsercmd 60 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW mc_underground
getviewpos state
screenshot 640 480
set g_stopTime 0
devmap game/alphalabs1
noclip
setviewpos -668 800 164.25 270
testUsercmd 60 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW alphalabs1
getviewpos state
screenshot 640 480
set g_stopTime 0
devmap game/delta2a
noclip
setviewpos -32 -1084 -123.73 270
testUsercmd 60 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW delta2a
getviewpos state
screenshot 640 480
set g_stopTime 0
devmap game/enpro
noclip
testUsercmd 60 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW enpro
getviewpos state
screenshot 640 480
set g_stopTime 0
devmap game/recycling1
noclip
setviewpos -1296 3440 292.25 180
testUsercmd 60 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW recycling1
getviewpos state
screenshot 640 480
set g_stopTime 0
devmap game/hell1
noclip
testUsercmd 60 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW hell1
getviewpos state
screenshot 640 480
set g_stopTime 0
devmap game/delta5
noclip
testUsercmd 60 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW delta5
getviewpos state
screenshot 640 480
set g_stopTime 0
// Heat haze through glass, vertex-masked and mask-only heat, masked
// reflection glass (viewpoints from render_heat_parity and render_parity).
devmap game/mars_city2
noclip
setviewpos -3200 -2884 269 0
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW heat_glass
getviewpos state
screenshot 640 480
set g_stopTime 0
setviewpos -1908 -304 274 0
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW heat_breaky
getviewpos state
screenshot 640 480
set g_stopTime 0
setviewpos -1724 -2341 247 0
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW heat_mask
getviewpos state
screenshot 640 480
set g_stopTime 0
setviewpos -2370 -2800 280 90
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW reflect_glass
getviewpos state
screenshot 640 480
set g_stopTime 0
// Skinned monster, weapon and HUD: stock imp approaching the player.
set g_showHud 1
set ui_showGun 1
set g_skill 1
devmap game/mars_city2
setviewpos -226 -2254 84 90
testUsercmd 200 0 0 0 0
spawn monster_demon_imp name scene_imp origin "-226 -2030 16" angle 270 neverDormant 1
testUsercmd 120 0 0 0 0
set g_stopTime 1
echo SCENE_VIEW imp
getviewpos state
screenshot 640 480
set g_stopTime 0
quit
