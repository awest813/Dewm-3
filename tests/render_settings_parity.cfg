// Player-adjustable graphics settings, one at a time (native and web): the
// options exposed by the web Graphics panel besides gamma/brightness and
// frame rate (render_effects_parity.cfg). Native: native_capture.py --fixture settings.
set r_fullscreen 0
set r_mode 3
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set com_showFPS 0
set developer 1
set s_noSound 1
set in_nograb 1
set g_stopTime 0
set g_showHud 0
set ui_showGun 0
set g_testPostProcess ""
set g_skipViewEffects 1
set r_gammaInShader 1
set r_gamma 1
set r_brightness 1
set r_useSoftParticles 1
set r_shadows 1
set r_showShadows 0
set r_useCarmacksReverse 1
set r_useStencilOpSeparate 1
set r_useExternalShadows 1
set r_useShadowVertexProgram 1
set r_shadowPolygonOffset -1
set r_shadowPolygonFactor 0
set r_skipBump 0
set r_skipSpecular 0
set r_skipAmbient 0
set r_skipInteractions 0
set r_skipNewAmbient 0
set r_skipFogLights 0
set com_machineSpec 3
execMachineSpec nores
set image_anisotropy 8
set r_screenshotFormat 2
set s_constantAmplitude 0.5
devmap game/alphalabs1
noclip
setviewpos -668 800 164.25 270
testUsercmd 59 0 0 0 0
set g_stopTime 0
set r_shadows 0
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo SETTING_VIEW shadows_off
getviewpos state
screenshot 640 480
set r_shadows 1
set g_stopTime 0
set r_skipBump 1
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo SETTING_VIEW bump_off
getviewpos state
screenshot 640 480
set r_skipBump 0
set g_stopTime 0
set r_skipSpecular 1
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo SETTING_VIEW specular_off
getviewpos state
screenshot 640 480
set r_skipSpecular 0
set g_stopTime 0
set image_anisotropy 1
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo SETTING_VIEW filtering_standard
getviewpos state
screenshot 640 480
set image_anisotropy 8
set g_stopTime 0
devmap game/hell1
noclip
testUsercmd 59 0 0 0 0
set g_stopTime 0
set r_useSoftParticles 0
testUsercmd 1 0 0 0 0
set g_stopTime 1
echo SETTING_VIEW soft_particles_off
getviewpos state
screenshot 640 480
set r_useSoftParticles 1
set g_stopTime 0
quit
