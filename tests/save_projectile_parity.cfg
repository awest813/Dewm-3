// Local licensed-data save lifecycle check. Use an isolated native save/config
// directory; each engine writes its own test save. This is not a stock Steam
// executable comparison or a cross-platform save-file compatibility test.
set r_fullscreen 0
set r_mode 3
set s_noSound 1
set in_nograb 1
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set developer 1
set g_stopTime 0
set g_debugRandomSeed 0
set ai_debugRandomEntity -1
devmap game/mars_city2
give weapons
give ammo
echo PARITY_PHASE selected
testUsercmd 100 0 0 0 0 5
getviewpos state
echo PARITY_PHASE held
testUsercmd 30 0 0 0 1
getviewpos state
echo PARITY_PHASE released
testUsercmd 1 0 0 0 0
getviewpos state
echo PARITY_PHASE flight
testUsercmd 45 0 0 0 0
getviewpos state
echo PARITY_PHASE saved
testUsercmd 0 0 0 0 0
getviewpos state
saveGame CodexProjectileResume_20261006
echo PARITY_PHASE uninterrupted_30
testUsercmd 30 0 0 0 0
getviewpos state
echo PARITY_PHASE uninterrupted_90
testUsercmd 90 0 0 0 0
getviewpos state
echo PARITY_PHASE uninterrupted_300
testUsercmd 300 0 0 0 0
getviewpos state
loadGame CodexProjectileResume_20261006
echo PARITY_PHASE restored
testUsercmd 0 0 0 0 0
getviewpos state
echo PARITY_PHASE replayed_30
testUsercmd 30 0 0 0 0
getviewpos state
echo PARITY_PHASE replayed_90
testUsercmd 90 0 0 0 0
getviewpos state
echo PARITY_PHASE replayed_300
testUsercmd 300 0 0 0 0
getviewpos state
set g_stopTime 1
condump "save-projectile-console.txt"
quit
