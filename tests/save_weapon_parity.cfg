// Isolated local licensed-data check. Each platform writes its own temporary
// save; this does not test cross-platform save-file compatibility.
set r_fullscreen 0
set r_mode 3
set s_noSound 1
set in_nograb 1
set com_allowConsole 1
set com_asyncInput 0
set com_fixedTic 1
set developer 1
set g_stopTime 0
devmap game/mars_city2
wait 5
give weapons
give ammo
testUsercmd 80 0 0 0 0 1
setviewpos -224 -2236 100 145
testUsercmd 20 0 0 0 0
echo PARITY_PHASE save_before
testUsercmd 0 0 0 0 0
saveGame CodexParityAudit_20261003
echo PARITY_PHASE changed
testUsercmd 20 127 0 0 0
testUsercmd 60 0 0 0 1
testUsercmd 30 0 0 0 0
loadGame CodexParityAudit_20261003
echo PARITY_PHASE save_after
testUsercmd 0 0 0 0 0
testUsercmd 30 0 0 0 0
echo PARITY_PHASE shotgun
testUsercmd 100 0 0 0 0 2
testUsercmd 60 0 0 0 1
testUsercmd 40 0 0 0 0
testUsercmd 300 0 0 0 0 13
echo PARITY_PHASE machinegun
testUsercmd 100 0 0 0 0 3
testUsercmd 60 0 0 0 1
testUsercmd 40 0 0 0 0
testUsercmd 300 0 0 0 0 13
echo PARITY_PHASE chaingun
testUsercmd 100 0 0 0 0 4
testUsercmd 60 0 0 0 1
testUsercmd 40 0 0 0 0
testUsercmd 300 0 0 0 0 13
echo PARITY_PHASE plasmagun
testUsercmd 100 0 0 0 0 6
testUsercmd 60 0 0 0 1
testUsercmd 40 0 0 0 0
testUsercmd 300 0 0 0 0 13
condump "save-weapon-console.txt"
quit
