// Long live-AI gameplay soak (native and web): three maps with spawned or
// placed monsters, scripted strafing, movement and fire, god mode so the run
// continues. Clocks and random seeds every 30 ticks (RENDER_STATE), player
// state after each input (USERCMD_CHECK). Verify with build-web/benchtools/soak_check.py.
set r_fullscreen 0
set r_mode 3
set com_allowConsole 1
set com_wipeSeconds 0
set com_asyncInput 0
set com_fixedTic 1
set com_showFPS 0
set developer 1
set s_noSound 1
set in_nograb 1
set g_stopTime 0
set g_showHud 0
set ui_showGun 0
set g_testPostProcess ""
set g_skipViewEffects 1
set r_gammaInShader 1
set r_gamma 1
set r_brightness 1
set r_useSoftParticles 1
set r_shadows 1
set r_showShadows 0
set r_useCarmacksReverse 1
set r_useStencilOpSeparate 1
set r_useExternalShadows 1
set r_useShadowVertexProgram 1
set r_shadowPolygonOffset -1
set r_shadowPolygonFactor 0
set r_skipBump 0
set r_skipSpecular 0
set r_skipAmbient 0
set r_skipInteractions 0
set r_skipNewAmbient 0
set r_skipFogLights 0
set com_machineSpec 3
execMachineSpec nores
set image_anisotropy 8
set s_constantAmplitude 0.5
set g_skill 1
set g_showHud 0
devmap game/mars_city2
god
setviewpos -226 -2254 84 90
testUsercmd 200 0 0 0 0
spawn monster_demon_imp name soak_imp origin "-226 -2030 16" angle 270 neverDormant 1
